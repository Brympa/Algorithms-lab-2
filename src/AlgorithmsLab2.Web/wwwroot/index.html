<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithms Lab 2 — Рекурсивные алгоритмы</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (_) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();

        window.themeManager = {
            getTheme: function () {
                return document.documentElement.getAttribute("data-theme") || "dark";
            },
            setTheme: function (theme) {
                document.documentElement.setAttribute("data-theme", theme);
                try { localStorage.setItem("theme", theme); } catch (_) {}
                window.dispatchEvent(new CustomEvent("themechange", { detail: { theme: theme } }));
            },
            toggleTheme: function () {
                var current = this.getTheme();
                var next = current === "light" ? "dark" : "light";
                this.setTheme(next);
                return next;
            }
        };
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-spinner"></div>
            <div class="boot-text">Загрузка WebAssembly…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Непредвиденная ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        document.addEventListener("input", function (e) {
            if (e.target && e.target.type === "number" && e.target.max) {
                var max = Number(e.target.max);
                var val = Number(e.target.value);
                if (!isNaN(val) && !isNaN(max) && max > 0 && val > max) {
                    e.target.value = max;
                }
            }
        }, true);
    </script>
</body>

</html>
